# Network detections: scanning, C2 (IOC, protocol abuse, behavioural), exfiltration, DNS.
- id: SOC-SCAN-020
  name: Vertical port scan against the perimeter
  category: reconnaissance
  severity: medium
  confidence: high
  risk: 45
  tactic: reconnaissance
  technique: [T1595.001, T1046]
  description: >-
    10+ distinct destination ports DENIED from a single source within 5 minutes. The filter
    removes the licensed vulnerability scanner - and that filter is the interesting part: with
    auto-response wired up, an unfiltered scan rule is an outage waiting to happen.
  logsource:
    dataset: [firewall]
  condition:
    - event.action: [deny, drop, reject]
      destination.port:
        exists: true
  threshold:
    field: [source.ip]
    distinct_field: destination.port
    min_events: 10
    window_minutes: 5
  filter:
    - source.ip: [203.0.113.77]
  references:
    - https://attack.mitre.org/techniques/T1595/001/

- id: SOC-C2-021
  name: Cobalt Strike / malleable-C2 URI pattern
  category: command_and_control
  severity: high
  confidence: high
  risk: 80
  tactic: command-and-control
  technique: [T1071.001, T1105]
  description: Beacon-shaped URIs (POST to /submit/..., /gate.php, /load.php, pixel.gif, cacert_NN).
  logsource:
    dataset: [web, proxy]
  condition:
    - url.path:
        regex: '(?i)/(submit/[a-z]{2,10}\.php|gate\.php|load\.php|pixel\.gif|cacert\.a[0-9]{2})'

- id: SOC-C2-022
  name: Beacon to a host on the threat-intel feed
  category: command_and_control
  severity: critical
  confidence: high
  risk: 88
  tactic: command-and-control
  technique: [T1071, T1105]
  description: >-
    Any outbound web or DNS record whose destination is on the internal block list. Pure IOC
    matching: cheap and high precision, but it dies the moment the adversary registers a new
    domain - which is exactly why SOC-C2-023 exists next to it.
  logsource:
    dataset: [web, proxy, dns]
  condition:
    - destination.domain: [cdn-update-service.net, login-secure-ms.com, exfil-drop.cloud]
    - dns.question.name:
        wildcard: '*cdn-update-service.net*'

- id: SOC-C2-023
  name: Beaconing detected by interval regularity (no IOC required)
  category: command_and_control
  severity: high
  confidence: medium
  risk: 72
  tactic: command-and-control
  technique: [T1071.001, T1029]
  description: >-
    Behavioural rule. For each (source IP, destination domain) pair with 12+ outbound web records
    in 30 minutes, compute the coefficient of variation (stdev / mean) of inter-request intervals.
    CoV under 0.08 with a 20-600 s mean is machine-driven polling. This catches C2 on a domain
    registered an hour ago that no feed has ever heard of.
  logsource:
    dataset: [web, proxy]
  condition:
    - network.direction: outbound
      process.name:
        exists: true
  config:
    group_by: [source.ip, destination.domain]
    threshold:
      min_events: 12
      window_minutes: 30
    time_stats:
      max_cov: 0.08
      min_interval_s: 20
      max_interval_s: 600
    # allow-list of things that legitimately poll at a steady clip. Documented, because an
    # undocumented allow-list is just a false-negative factory.
    exclude_processes: [chrome.exe, firefox.exe, msedge.exe, teams.exe, outlook.exe, code.exe,
                        spotify.exe, onedrive.exe, searchapp.exe, nissrv.exe]
  references:
    - https://www.sans.org/white-papers/33900/

- id: SOC-EXFIL-024
  name: Large outbound transfer to an external host
  category: exfiltration
  severity: high
  confidence: medium
  risk: 76
  tactic: exfiltration
  technique: [T1048, T1567.002]
  description: 100 MB+ in one outbound request to a named external host (proxy, web or firewall record).
  logsource:
    dataset: [web, proxy, firewall]
  condition:
    - "@any_of":
        - network.bytes:
            gte: 100000000
        - bytes_sent:
            gte: 100000000
  threshold:
    field: [source.ip]
    min_events: 1
    window_minutes: 30

- id: SOC-EXFIL-025
  name: Outbound SMB to a non-internal address
  category: exfiltration
  severity: medium
  confidence: low
  risk: 48
  tactic: exfiltration
  technique: [T1048.002]
  description: 445/tcp allowed to a destination outside RFC1918 - file-share traffic should never leave the perimeter.
  logsource:
    dataset: [firewall]
  condition:
    - destination.port: 445
      destination.ip_not_private: true
      event.action: [allow, accept]

- id: SOC-DGA-026
  name: DGA / dynamic-DNS lookups
  category: command-and-control
  severity: medium
  confidence: high
  risk: 60
  tactic: command-and-control
  technique: [T1568.002, T1583.001]
  description: >-
    Algorithmic-looking hostnames or dynamic-DNS zones, four or more per client in 15 minutes.
    Volume is the discriminator, not the shape of the name - malware authors make names look
    boring on purpose.
  logsource:
    dataset: [dns]
  condition:
    - dns.question.name:
        regex: '(?i)([a-z0-9]{12,}\.(net|com|org)|\.(noip|duckdns|dynv6|hopto)\.(org|net)|-update\.net$)'
  threshold:
    field: [source.ip]
    min_events: 4
    window_minutes: 15

- id: SOC-DNSTUN-027
  name: DNS tunneling / oversized DNS responses
  category: exfiltration
  severity: high
  confidence: medium
  risk: 70
  tactic: exfiltration
  technique: [T1071.004, T1048.003]
  description: >-
    10+ DNS answers over 2.5 KB from one client within 15 minutes. TXT records that big are a
    covert channel far more often than they are a legitimate design choice.
  logsource:
    dataset: [dns]
  condition:
    - network.bytes:
        gte: 2500
  threshold:
    field: [source.ip]
    min_events: 10
    window_minutes: 15

- id: SOC-DNS-028
  name: DGA lookups where one finally resolved
  category: command-and-control
  severity: medium
  confidence: medium
  risk: 66
  tactic: command-and-control
  technique: [T1568.002]
  description: >-
    A previously-NXDOMAIN-looking hostname that came back NOERROR: the malware just found live
    C2 infrastructure. High-fidelity variant of SOC-DGA-026.
  logsource:
    dataset: [dns]
  condition:
    - dns.rcode: NOERROR
      dns.question.name:
        regex: '(?i)[a-z0-9]{6,}\.a1f3-update\.net'
  threshold:
    field: [source.ip]
    min_events: 1
    window_minutes: 15
